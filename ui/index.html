<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=800, initial-scale=1, user-scalable=no">
<title>Satellite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="face">
  <div id="ring"></div>

  <div id="center">
    <!-- default: time, date, weather -->
    <section class="view shown" id="v-home">
      <div class="time" id="h-time">--:--</div>
      <div class="date" id="h-date"></div>
      <div class="wx" id="h-wx"></div>
      <div class="strip" id="h-strip"></div>
    </section>

    <section class="view" id="v-spotify"></section>
    <section class="view" id="v-radio"></section>
    <section class="view" id="v-phone"></section>
    <section class="view" id="v-calendar"></section>
    <section class="view" id="v-audible"></section>
    <section class="view" id="v-weather"></section>
    <section class="view" id="v-timers"></section>
    <section class="view" id="v-clock"></section>
    <section class="view" id="v-ha"></section>
  </div>

  <div id="saver"></div>
  <div id="alarm"><div class="pulse"></div><div style="position:relative">
    <h1>Time's up</h1><p id="alarm-label"></p>
    <button class="pill warn" id="alarm-stop" style="font-size:22px;padding:16px 40px">Stop</button>
  </div></div>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
<script src="books.js"></script>
</body>
</html>
