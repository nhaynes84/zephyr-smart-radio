# /etc/asound.conf -- Spotify, radio and the timer chime share the MAX98357A
# amp (I2S1, dt/max98357a-i2s1.dts), so mix them in software.
#
#   default -> sateq (tone) -> satvol (Master volume) -> satmix (dmix) -> amp
#
# The EQ goes FIRST: alsaequal works in float and fails format negotiation
# behind a softvol. Its curve is cuts only (nothing above flat), so the float
# -> S16 step after it can never clip.
pcm.!default {
    type plug
    slave.pcm "sateq"
}
# Master volume for everything (the knob; satd /api/volume). The control
# appears on the card the first time something opens this PCM.
pcm.satvol {
    type softvol
    slave.pcm "satmix"
    control {
        name "Master"
        card max98357a
    }
    min_dB -45.0
    max_dB 0.0
}
# Tone: 10-band EQ (alsaequal + CAPS Eq10, libasound2-plugin-equal). Every
# player runs its own instance against ONE shared settings file, so a change
# (amixer -D sateq, or satd) applies to all of them. Tuned for the PC83 in
# its small sealed box: see satd's EQ_PC83.
pcm.sateq {
    type equal
    slave.pcm "plug:satvol"
    controls "/var/lib/satd/alsaequal.bin"
}
ctl.sateq {
    type equal
    controls "/var/lib/satd/alsaequal.bin"
}
pcm.satmix {
    type dmix
    ipc_key 4096
    ipc_perm 0666
    slave {
        pcm "hw:CARD=max98357a,DEV=0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
ctl.!default {
    type hw
    card max98357a
}
